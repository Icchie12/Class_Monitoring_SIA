<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Student Monitoring</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container narrow">
  <div class="card">
    <h1>Student Class Monitor</h1>
    <p>Enter the class session details provided by your teacher.</p>
    <input id="sessionId" type="number" placeholder="Session ID">
    <input id="studentName" placeholder="Name as registered in Google Classroom">
    <button onclick="join()">Start Monitoring</button>
    <p id="msg"></p>
  </div>
</div>
<script>
async function join() {
  const sessionId = Number(document.getElementById('sessionId').value);
  const name = document.getElementById('studentName').value.trim();
  if (!sessionId || !name) return alert('Enter the session ID and your Classroom name.');

  const r = await fetch('/api/student/join', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({session_id:sessionId, student_name:name, extension_id:'chrome-extension'})
  });
  const data = await r.json();
  if (data.error) return alert(data.error);

  localStorage.setItem('monitorStudentId', data.student_id);
  localStorage.setItem('monitorSessionId', sessionId);

  // The extension's content script on this page receives this configuration.
  window.postMessage({
    type:'ONLINE_CLASS_MONITOR_CONFIG',
    studentId:data.student_id,
    sessionId:sessionId,
    apiBase: window.location.origin
  }, '*');

  document.getElementById('msg').textContent =
    'Monitoring started. Keep the Chrome extension enabled while you attend Google Meet.';
}
</script>
</body>
</html>
